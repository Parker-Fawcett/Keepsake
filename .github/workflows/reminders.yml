name: Deliver reminders

on:
  schedule:
    # Avoid the top of the hour, when scheduled Actions are most congested.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepsake-reminder-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.REMINDERS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run worker
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://keepsake-yz0k.onrender.com
          KEEPSAKE_WEBHOOK_URL: ${{ secrets.KEEPSAKE_WEBHOOK_URL }}

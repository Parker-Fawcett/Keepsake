name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'server/migrate.js'
      - 'server/db.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepsake-production-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
